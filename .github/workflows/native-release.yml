name: Native Release (build + submit)
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'app.config.js'
      - 'eas.json'
      - 'package.json'
      - 'package-lock.json'
jobs:
  build-submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: eas build --platform android --profile production --auto-submit --non-interactive
